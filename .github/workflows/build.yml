name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ORT_VERSION: "1.24.4"
  # 1.23.0 is the last ONNX Runtime with macOS x86_64 and universal2 builds;
  # 1.24 is Apple Silicon only. Using it keeps one bundle working on Intel Macs.
  ORT_MACOS_VERSION: "1.23.0"
  OBS_VERSION: "31.1.1"

jobs:
  # The bundled models are converted from TFLite/Paddle and are not committed,
  # so build them once and share them with every platform job.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache converted models
        id: cache
        uses: actions/cache@v4
        with:
          path: models/converted
          key: models-${{ hashFiles('tools/models/convert_models.py', 'tools/models/fix_mediapipe_ops.py', 'tools/models/fix_pphumanseg.py') }}
      - name: Convert models
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/models/requirements.txt
          python tools/models/convert_models.py
          python tools/models/fix_pphumanseg.py
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models/converted
          retention-days: 1

  linux:
    needs: models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models/converted
      - name: Install build dependencies
        run: |
          sudo apt-get update
          # obs-studio itself is needed as well: the .deb declares a dependency on
          # it, so the install check below cannot run without it present.
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libobs-dev obs-studio libcurl4-openssl-dev nlohmann-json3-dev file
      - name: Fetch ONNX Runtime
        run: |
          curl -fsSL -O https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz
          tar xzf onnxruntime-linux-x64-${ORT_VERSION}.tgz
          echo "ORT_ROOT=$PWD/onnxruntime-linux-x64-${ORT_VERSION}" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROMATTE_ORT_ROOT="$ORT_ROOT"
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: LD_LIBRARY_PATH="$ORT_ROOT/lib" ./build/bin/promatte-unit-tests
      - name: Package
        run: |
          cd build && cpack
          size=$(stat -c%s promatte_*.deb)
          echo "package size: $size bytes"
          if [ "$size" -lt 10000000 ]; then
            echo "package is too small to contain the models and runtime"; exit 1
          fi
      - name: Verify the package installs and the module loads
        run: |
          sudo dpkg -i build/promatte_*.deb
          dpkg -L promatte | head -20
          # grep exits non-zero when it finds nothing, which is the good case here,
          # so test for the presence of unresolved libraries rather than chaining.
          if ldd /usr/lib/obs-plugins/promatte.so | grep -F "not found"; then
            echo "unresolved shared libraries"; exit 1
          fi
          cat > /tmp/loadtest.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(void) {
              void *h = dlopen("/usr/lib/obs-plugins/promatte.so", RTLD_NOW);
              if (!h) { printf("dlopen FAILED: %s\n", dlerror()); return 1; }
              return dlsym(h, "obs_module_load") ? 0 : 2;
          }
          EOF
          gcc /tmp/loadtest.c -o /tmp/loadtest -ldl && /tmp/loadtest && echo "module loads"
      - uses: actions/upload-artifact@v4
        with:
          name: promatte-linux-x86_64
          path: |
            build/*.deb
            build/*.tar.gz

  macos:
    needs: models
    # macos-15 for the macOS 15 SDK (Xcode 16), which OBS 31 requires;
    # the macos-14 image ships SDK 14.5 and libobs refuses to configure.
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models/converted
      - name: Install build dependencies
        run: brew install cmake ninja nlohmann-json
      - name: Fetch ONNX Runtime (universal2)
        run: |
          curl -fsSL -O https://github.com/microsoft/onnxruntime/releases/download/v${ORT_MACOS_VERSION}/onnxruntime-osx-universal2-${ORT_MACOS_VERSION}.tgz
          tar xzf onnxruntime-osx-universal2-${ORT_MACOS_VERSION}.tgz
          echo "ORT_ROOT=$PWD/onnxruntime-osx-universal2-${ORT_MACOS_VERSION}" >> "$GITHUB_ENV"
          lipo -archs onnxruntime-osx-universal2-${ORT_MACOS_VERSION}/lib/libonnxruntime.dylib
      - name: Cache libobs
        id: obscache
        uses: actions/cache@v4
        with:
          path: obs-sdk
          key: libobs-${{ env.OBS_VERSION }}-macos15-universal-v1
      - name: Build libobs
        if: steps.obscache.outputs.cache-hit != 'true'
        run: |
          # No Homebrew formula ships libobs headers, so build the library only:
          # no plugins, no frontend, which keeps this to a few minutes.
          curl -fsSL -o obs.tar.gz https://github.com/obsproject/obs-studio/archive/refs/tags/${OBS_VERSION}.tar.gz
          tar xzf obs.tar.gz
          curl -fsSL -o deps.tar.xz https://github.com/obsproject/obs-deps/releases/download/2025-07-11/macos-deps-2025-07-11-universal.tar.xz
          mkdir -p obs-deps && tar xf deps.tar.xz -C obs-deps
          # OBS' own cmake refuses any generator but Xcode on macOS
          # (cmake/macos/compilerconfig.cmake), so libobs is built with Xcode
          # even though ProMatte itself builds with Ninja.
          cmake -S obs-studio-${OBS_VERSION} -B obs-build -G Xcode \
            -DCMAKE_PREFIX_PATH="$PWD/obs-deps" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DOBS_CMAKE_VERSION=3.0.0 \
            -DENABLE_PLUGINS=OFF -DENABLE_FRONTEND=OFF -DENABLE_UI=OFF \
            -DENABLE_SCRIPTING=OFF -DOBS_VERSION_OVERRIDE=${OBS_VERSION} \
            -DCODESIGN_IDENTITY=- -DCODESIGN_TEAM=
          # The Development component installs obs-frontend-api too, so build it as
          # well even though ProMatte does not use it; tools/setup-deps.ps1 builds
          # the same pair on Windows.
          # Separate invocations: the Xcode generator did not honour two --target
          # arguments in one call, so obs-frontend-api silently went unbuilt and
          # only surfaced when the Development component tried to install it.
          cmake --build obs-build --config Release --parallel --target libobs
          cmake --build obs-build --config Release --parallel --target obs-frontend-api
          cmake --install obs-build --config Release --component Development --prefix "$PWD/obs-sdk"
      - name: Configure
        run: |
          # libobs installs as a framework, so point at its config directory
          # directly rather than relying on framework search heuristics.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPROMATTE_ORT_ROOT="$ORT_ROOT" \
            -Dlibobs_DIR="$PWD/obs-sdk/Frameworks/libobs.framework/Resources/cmake" \
            -DCMAKE_PREFIX_PATH="$PWD/obs-sdk;$PWD/obs-deps" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: DYLD_LIBRARY_PATH="$ORT_ROOT/lib" ./build/bin/promatte-unit-tests
      - name: Package
        run: cd build && cpack
      - name: Verify the bundle would load in OBS
        # 1.0.1 passed the checks that used to live here - otool output piped to
        # head, plus an archive size test - and still failed to load on a real
        # Mac: the module had no @executable_path rpath to find libobs inside
        # OBS.app, and the vendored ONNX Runtime was written under the name of the
        # unversioned symlink rather than the versioned name dyld asks for. This
        # resolves every load command against the bundle instead of printing them.
        run: python3 tools/check-macos-bundle.py build/promatte.plugin
      - name: Show the bundle layout and check the package is not empty
        run: |
          find build/promatte.plugin -maxdepth 3 | head -30
          otool -L build/promatte.plugin/Contents/MacOS/promatte
          otool -l build/promatte.plugin/Contents/MacOS/promatte | grep -A2 LC_RPATH
          echo "--- architectures ---"
          # Both slices must be present or the plugin will not load on Intel Macs.
          for f in build/promatte.plugin/Contents/MacOS/promatte \
                   build/promatte.plugin/Contents/Frameworks/libonnxruntime*.dylib; do
            archs=$(lipo -archs "$f")
            echo "$f: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "not universal"; exit 1 ;;
            esac
          done
          # The bundle carries the models and ONNX Runtime, so an archive that
          # comes out tiny means the install rules dropped its contents.
          size=$(stat -f%z build/ProMatte-*-macos-*.zip)
          echo "archive size: $size bytes"
          if [ "$size" -lt 10000000 ]; then
            echo "archive is too small to contain the models and runtime"; exit 1
          fi
          echo "--- archive contents ---"
          unzip -l build/ProMatte-*-macos-*.zip | head -15
      - name: Verify the packaged bundle, not only the built one
        # The archive is what users unpack, so re-run the check on its contents:
        # an install rule that dropped or renamed a file would not show up above.
        run: |
          mkdir -p /tmp/pkgcheck
          unzip -q build/ProMatte-*-macos-*.zip -d /tmp/pkgcheck
          python3 tools/check-macos-bundle.py /tmp/pkgcheck/*/promatte.plugin
      - uses: actions/upload-artifact@v4
        with:
          name: promatte-macos-universal
          path: |
            build/*.zip
            build/*.tar.gz
