Preset.NoFraming="Presets tune matte quality and speed only. None of them crop or zoom - to show just your head, add OBS' Crop/Pad filter or resize the source in the scene."
Preset.Webcam.Desc="Balanced edge quality and speed. A good default for everyday webcam use."
Preset.TalkingHead.Desc="Softer hair and shoulder edges, keeps slightly more of you at the edge, and smooths the matte harder for a presenter who mostly stays still. Uses a higher AI resolution, so it costs more."
Preset.Gaming.Desc="Lowest latency: smallest AI resolution, fastest edge upsampling and a quick motion response so the matte keeps up with fast movement."
Preset.HighQuality.Desc="Highest AI resolution with the strongest edge decontamination. Needs a capable GPU; on a slower machine the automatic controller steps it back down."
Preset.LowEnd.Desc="Minimum load: smallest AI resolution, cheapest edge upsampling, no decontamination, and the AI runs at most 15 times a second."
Preset.GreenScreen.Desc="For virtual backgrounds: a crisper edge pulled in slightly, with strong decontamination and halo removal so no background colour fringes remain."
Preset.Custom.Desc="Your own settings. Changing any slider or quality option switches the preset to Custom."

